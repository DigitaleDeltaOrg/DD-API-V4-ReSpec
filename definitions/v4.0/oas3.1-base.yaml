openapi: 3.1.0
info:
  title: DD-API-V4 - Base schema
  # Aanpassen
  description: Digitale Delta API V4
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  version: 4.0.0
  x-logo:
    # Eventueel uitbreiden met eigen tekst
    url: /v4/DigitaleDelta.svg
externalDocs:
  description: Official documentation
  url: https://digitaledeltaorg.github.io/DD-API-V4-ReSpec/

# AANPASSEN: Voeg hier je eigen server URL's toe
# servers:
#   - url: https://api.example.com
#     description: Production server
#   - url: https://test-api.example.com
#     description: Test server

# OPTIONEEL TOEVOEGEN: Beveiligingsrequirements op API-niveau
# Kies een van de onderstaande opties of combineer ze
# security:
#   - apiKey: [] # Voor API key authenticatie
#   - bearerAuth: [] # Voor Bearer token (OAuth2/JWT)
#   - oauth2: [] # Voor OAuth2 flows
#   - mTls: [] # Voor mTLS authenticatie

paths:
  /v4/odata/observations:
    description: Provides access to observations.
    get:
      tags:
        - Observation
        - Foi
        - FeatureOfInterest
        - Parameter
      summary: Get entities from observations
      description: Get the observation data of the Digitale Delta API.
      operationId: observations.Observation.ListObservation
      # OPTIONEEL: Beveiligingseisen per endpoint (overschrijft API-niveau security)
      # security:
      #   - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/top'
        - $ref: '#/components/parameters/skiptoken'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/select'
      responses:
        '200':
          $ref: '#/components/responses/DigitaleDelta.ObservationCollectionResponse'
        default:
          $ref: '#/components/responses/error'

  /v4/odata/parameters:
    description: Provides access to domain tables/enties for possible items in parameters.
    get:
      tags:
        - Parameter
      summary: Get entities from references
      description: Get the reference data of the Digitale Delta API.
      operationId: parameters.ListParameters
      # OPTIONEEL: Beveiligingseisen per endpoint (overschrijft API-niveau security)
      # security:
      #   - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/top'
        - $ref: '#/components/parameters/skiptoken'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/select'
      responses:
        '200':
          $ref: '#/components/responses/DigitaleDelta.ParameterCollectionResponse'
        default:
          $ref: '#/components/responses/error'

  /v4/odata/foi:
    description: Provides access to information for features of interest. This includes measurement objects and monitoring networks.
    get:
      tags:
        - Foi
        - FeatureOfInterest
      summary: Get entities from references
      description: Get the reference data of the Digitale Delta API.
      operationId: foi.ListFoi
      # OPTIONEEL: Beveiligingseisen per endpoint (overschrijft API-niveau security)
      # security:
      #   - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/top'
        - $ref: '#/components/parameters/skiptoken'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/select'
      responses:
        '200':
          $ref: '#/components/responses/DigitaleDelta.FoiCollectionResponse'
        default:
          $ref: '#/components/responses/error'

  /v4/geo/measurementobject:
    get:
      tags:
        - FeatureOfInterest
        - Foi
        - JSON-FG
      summary: Get list of measurement objects.
      description: Get a list of measurement objects.
      operationId: geo.MeasurementObject.GetList
      responses:
        '200':
          description: Retrieved measurement objects
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/error'
        default:
          $ref: '#/components/responses/error'
  
  /v4/geo/measurementobject/{id}:
    get:
      tags:
        - FeatureOfInterest
        - FoI
        - JSON-FG
      summary: Get measurement object by id
      description: Get a single measurement object by its identifier.
      operationId: geo.MeasurementObject.GetMeasurementObjectById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the measurement object.
          schema:
            type: string
      responses:
        '200':
          description: Retrieved measurement object
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/error'
        default:
          $ref: '#/components/responses/error'
    
components:
  # TOEVOEGEN/VERWIJDEREN: Kies één of meer beveiligingsschema's die passen bij je implementatie, indien nodig
  securitySchemes:
    # Optie 1: API Key - eenvoudig maar minder veilig
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

    # Optie 2: Bearer Token (JWT/OAuth2 access token)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication (JWT)

    # Optie 3: OAuth2 - voor gedelegeerde autorisatie
    oauth2:
      type: oauth2
      description: OAuth2 authentication
      flows:
        # Client Credentials flow (machine-to-machine)
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth2/token
          scopes:
            read:observations: Read access to observations
            read:parameters: Read access to parameters
            read:measurementobjects: Read access to measurement objects
      # Authorisation Code flow (user context)
        # authorizationCode:
        #   authorizationUrl: https://auth.example.com/oauth2/authorize
        #   tokenUrl: https://auth.example.com/oauth2/token
        #   scopes:
        #     read:observations: Read access to observations
        #     read:references: Read access to references

    # Optie 4: mTLS
    mTLS:
      type: http
      scheme: mutualTLS
      description: Mutual TLS authentication

    # Optie 5: OpenID Connect
    openIdConnect:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration
      description: OpenID Connect authentication

  schemas:
    DigitaleDelta.Parameter:
      title: Parameter
      type: object
      description: A reference is an entity to which observations can refer.
      properties:
        id:
          type: string
          description: Unique ID of the reference.
        type:
          type: string
          nullable: true
          description: Type of the reference
        organisation:
          type: string
          nullable: true
          description: Organisation responsible for the reference
        code:
          type: string
          description: Code of the reference
        description:
          type: string
          description: Short description of the reference
        details:
          $ref: "#/components/schemas/DigitaleDelta.ParameterDetailsContainer".
    
    DigitaleDelta.Foi:
      title: Feature of Interest
      description: Feature of Interest as defined in the DD API V4 CSDL.
      type: object
      required:
        - id
        - code
        - description
      properties:
        id:
          type: string
          description: Id of the Feature of Interest.
        type:
          type: string
          nullable: true
          description: Type of the Feature of Interest.
        organisation:
          type: string
          nullable: true
          description: Organisation responsible for the Feature of Interest.
        code:
          type: string
          description: Code of the Feature of Interest.
        geometry:
          anyOf:
            - $ref: '#/components/schemas/Edm.Geometry'
            - type: object
              nullable: true
        description:
          type: string
          description: Description of the Feature of Interest.
        identities:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.FoiIdentityContainer'
            - type: object
              nullable: true
        classifications:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.FoiClassificationContainer'
            - type: object
              nullable: true
        # Uitbreiden met eigen selectie van eigenschappen uit semantics.csv groep FoI
  
  
    DigitaleDelta.Observation:
      title: Observation
      type: object
      description: Defines an observation. The type of the observation defines how the results are expressed.
      required:
        - id
        - type
        - resultTime
        - phenomenonTime
        - parameter
        - modifiedOn
      properties:
        id:
          type: string
          description: Unique ID of the observation.
        type:
          type: string
          description: Type of the observation.
        resultTime:
          type: string
          format: date-time
        phenomenonTime:
          $ref: '#/components/schemas/DigitaleDelta.TmPeriod_Closed'
        validTime:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.TmPeriod_OpenEnd'
            - type: object
              nullable: true
        parameter:
          $ref: '#/components/schemas/DigitaleDelta.ParameterContainer'
        metadata:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.MetadataContainer'
            - type: object
              nullable: true
        foi:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.Foi'
            - type: object
              nullable: true
          description: Feature of Interest.
        result:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.Result'
            - type: object
              nullable: true
        modifiedOn:
          type: string
          format: date-time
  
    DigitaleDelta.TmPeriod_OpenEnd:
      title: TmPeriod_OpenEnd
      type: object
      required:
        - begin
      properties:
        begin:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          nullable: true
    
    DigitaleDelta.TmPeriod_Closed:
      title: TmPeriod_Closed
      type: object
      required:
        - begin
        - end
      properties:
        begin:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        
      DigitaleDelta.RelatedObservation:
      allOf:
        - $ref: '#/components/schemas/DigitaleDelta.Observation'
        - title: RelatedObservation
          type: object
          description: Defines a related observation
          properties:
            role:
              type: string
              nullable: true

    DigitaleDelta.ParameterContainer:
      title: ParameterContainer
      type: object
      description: Defines the quantifiable references related to the observation
      properties:
      # Uitbreiden met eigen selectie van eigenschappen uit semantic.csv groep Parameter
      
    DigitaleDelta.ParameterDetailsContainer:
      title: ParameterDetailsContainer
      type: object
      description: Defines the quantifiable references known to the system
      properties:
      # Uitbreiden met eigen selectie van eigenschappen uit semantic.csv groep Parameter
    
    DigitaleDelta.FoiIdentityContainer:
      title: FoiIdentityContainer
      type: object
      description: Defines alternate identities for FoI.
      properties:
      # Uitbreiden met eigen selectie van eigenschappen uit semantics.csv groep FoIIdentity
      
    DigitaleDelta.FoiClassificationContainer:
      title: FoiClassificationContainer
      type: object
      description: Defines classifications for FoI.
      properties:
      # Uitbreiden met eigen selectie van eigenschappen uit semantics.csv groep FoIClassification

    DigitaleDelta.MetadataContainer:
      title: MetadataContainer
      type: object
      description: Non-quantifiable data
      properties:
      # Uitbreiden met eigen selectie van eigenschappen uit semantic.csv groep Metadata
      
    DigitaleDelta.Result:
      title: Result
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Unique ID of the result.
        truth:
          type: boolean
          nullable: true
          description: Truth observation. Can only result in true or false.
        count:
          type: integer
          format: int64
          nullable: true
          description: Count observation. No unit specified and the value can only be an integer value.
        measure:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.Measure'
            - type: object
              nullable: true
          description: Result is expressed in a unit and a value.
        category:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.Category'
            - type: object
              nullable: true
          description: Result is expressed as a category.
        coverageJSON:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.CoverageJSON'
            - type: object
              nullable: true
          description: Result is expressed as CoverageJSON.
        retracted:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.Retracted'
            - type: object
              nullable: true
    
    DigitaleDelta.Measure:
      title: Measure
      type: object
      required:
        - uom
        - value
      properties:
        uom:
          type: string
          description: Unit of measurement.
        value:
          oneOf:
            - type: number
              format: double
            - type: string
          description: Measured value.
        namespace:
          type: string
          nullable: true
          description: Namespace of the unit of the measured value.
        limitSymbol:
          type: string
          nullable: true
          description: Limit symbol of the measured value.
    
    DigitaleDelta.Category:
      title: Category
      type: object
      required:
        - nameSpace
        - code
      properties:
        nameSpace:
          type: string
          description: Vocabulary namespace.
        code:
          type: string
          description: Term within the vocabulary.
    
    DigitaleDelta.Retracted:
      title: Retracted
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
      
    Edm.Geometry:
      oneOf:
        - $ref: '#/components/schemas/Edm.GeometryPoint'
        - $ref: '#/components/schemas/Edm.GeometryLineString'
        - $ref: '#/components/schemas/Edm.GeometryPolygon'
        - $ref: '#/components/schemas/Edm.GeometryMultiPoint'
        - $ref: '#/components/schemas/Edm.GeometryMultiLineString'
        - $ref: '#/components/schemas/Edm.GeometryMultiPolygon'
        - $ref: '#/components/schemas/Edm.GeometryCollection'
      discriminator:
        propertyName: type

    Edm.GeometryPoint:
      type: object
      properties:
        type:
          type: string
          enum:
            - Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2

    Edm.GeometryLineString:
      type: object
      properties:
        type:
          type: string
          enum:
            - LineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
          minItems: 2

    Edm.GeometryPolygon:
      type: object
      properties:
        type:
          type: string
          enum:
            - Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
            minItems: 4

    Edm.GeometryMultiPoint:
      type: object
      properties:
        type:
          type: string
          enum:
            - MultiPoint
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2

    Edm.GeometryMultiLineString:
      type: object
      properties:
        type:
          type: string
          enum:
            - MultiLineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
            minItems: 2

    Edm.GeometryMultiPolygon:
      type: object
      properties:
        type:
          type: string
          enum:
            - MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: number
                minItems: 2
              minItems: 4

    Edm.GeometryCollection:
      type: object
      properties:
        type:
          type: string
          enum:
            - GeometryCollection
        geometries:
          type: array
          items:
            $ref: '#/components/schemas/Edm.Geometry'

    DigitaleDelta.ODataErrors.ODataError:
      required:
        - error
      type: object
      description: Describes OData errors
      properties:
        error:
          $ref: '#/components/schemas/DigitaleDelta.ODataErrors.MainError'

    DigitaleDelta.ODataErrors.MainError:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
          nullable: true
        details:
          type: array
          items:
            $ref: '#/components/schemas/DigitaleDelta.ODataErrors.ErrorDetails'
        innererror:
          $ref: '#/components/schemas/DigitaleDelta.ODataErrors.InnerError'

    DigitaleDelta.ODataErrors.ErrorDetails:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
          nullable: true

    DigitaleDelta.Tm_Period:
      type: object
      properties:
        begin:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    DigitaleDelta.ODataErrors.InnerError:
      type: object
      description: The structure of this object is service-specific

    ODataCountResponse:
      type: integer
      format: int32
    
    DigitaleDelta.ParameterCollectionResponse:
      title: Collection of References
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseCollectionPaginationCountResponse'
        - type: object
          properties:
            value:
              type: array
              items:
                $ref: '#/components/schemas/DigitaleDelta.Parameter'
    
    DigitaleDelta.FoiCollectionResponse:
      title: Collection of References
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseCollectionPaginationCountResponse'
        - type: object
          properties:
            value:
              type: array
              items:
                $ref: '#/components/schemas/DigitaleDelta.Foi'

    DigitaleDelta.ObservationCollectionResponse:
      title: Collection of Observation
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseCollectionPaginationCountResponse'
        - type: object
          properties:
            value:
              type: array
              items:
                $ref: '#/components/schemas/DigitaleDelta.Observation'

    BaseCollectionPaginationCountResponse:
      title: Base collection pagination and count responses
      type: object
      properties:
        '@odata.count':
          type: integer
          format: int64
          nullable: true
        '@odata.nextLink':
          type: string
          nullable: true
          description: URL to retrieve the next page of results

    DigitaleDelta.CoverageJSON:
      title: CoverageJSON
      type: object
      properties:
        type:
          type: string
        domain:
          $ref: '#/components/schemas/DigitaleDelta.CoverageDomain'
        parameters:
          $ref: '#/components/schemas/DigitaleDelta.CoverageParameterContainer'
        ranges:
          $ref: '#/components/schemas/DigitaleDelta.CoverageRangeContainer'
        nodata:
          type: string
          nullable: true
        profile:
          type: string
          nullable: true

    DigitaleDelta.CoverageDomain:
      title: CoverageDomain
      type: object
      properties:
        type:
          type: string
        axes:
          $ref: '#/components/schemas/DigitaleDelta.CoverageAxes'
        referencing:
          type: array
          items:
            $ref: '#/components/schemas/DigitaleDelta.CoverageReferencing'
        CRS:
          type: string
          nullable: true

    DigitaleDelta.CoverageAxes:
      title: CoverageAxes
      type: object
      additionalProperties:
        $ref: '#/components/schemas/DigitaleDelta.CoverageAxis'
      properties:
        x:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.CoverageAxis'
            - type: object
              nullable: true

    DigitaleDelta.CoverageAxis:
      title: CoverageAxis
      type: object
      properties:
        type:
          type: string
          nullable: true
        values:
          type: array
          items:
            type: number
            format: double
        start:
          type: number
          format: double
          nullable: true
        size:
          type: integer
          format: int64
          nullable: true
        offset:
          type: number
          format: double
          nullable: true
        spacing:
          type: number
          format: double
          nullable: true
        keys:
          type: array
          items:
            type: string

    DigitaleDelta.CoverageReferencing:
      title: CoverageReferencing
      type: object
      properties:
        coordinates:
          type: string
          nullable: true
        system:
          type: string
          nullable: true
        datum:
          type: string
          nullable: true

    DigitaleDelta.CoverageParameterContainer:
      title: CoverageParameterContainer
      type: object
      additionalProperties:
        $ref: '#/components/schemas/DigitaleDelta.CoverageParameterDefinition'
      properties:
        temperature:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.CoverageParameterDefinition'
            - type: object
              nullable: true

    DigitaleDelta.CoverageParameterDefinition:
      title: CoverageParameterDefinition
      type: object
      properties:
        type:
          type: string
          nullable: true
        units:
          type: string
          nullable: true
        observedProperty:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        flags:
          type: string
          nullable: true

    DigitaleDelta.CoverageRangeContainer:
      title: CoverageRangeContainer
      type: object
      additionalProperties:
        $ref: '#/components/schemas/DigitaleDelta.CoverageRangeDefinition'
      properties:
        temperature:
          anyOf:
            - $ref: '#/components/schemas/DigitaleDelta.CoverageRangeDefinition'
            - type: object
              nullable: true

    DigitaleDelta.CoverageRangeDefinition:
      title: CoverageRangeDefinition
      type: object
      properties:
        type:
          type: string
          nullable: true
        dataType:
          type: string
          nullable: true
        axisNames:
          type: array
          items:
            type: string
        shape:
          type: array
          items:
            type: integer
            format: int64
        values:
          type: array
          items:
            type: number
            format: double
        encoding:
          type: string
          nullable: true
  responses:
    error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DigitaleDelta.ODataErrors.ODataError'

    ODataCountResponse:
      description: The count of the resource
      headers:
        Content-Crs:
          $ref: '#/components/headers/Content-Crs'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ODataCountResponse'

    DigitaleDelta.ObservationCollectionResponse:
      description: Retrieved observation collection
      headers:
        Content-Crs:
          $ref: '#/components/headers/Content-Crs'
        API-Version:
          $ref: '#/components/headers/API-Version'
        API-Deprecation-Date:
          $ref: '#/components/headers/API-Deprecation-Date'
        API-End-of-Life-Date:
          $ref: '#/components/headers/API-End-of-Life-Date'
        API-Next-Release:
          $ref: '#/components/headers/API-Next-Release'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DigitaleDelta.ObservationCollectionResponse'

    DigitaleDelta.ParameterCollectionResponse:
      description: Retrieved collection
      headers:
        Content-Crs:
          $ref: '#/components/headers/Content-Crs'
        API-Version:
          $ref: '#/components/headers/API-Version'
        API-Deprecation-Date:
          $ref: '#/components/headers/API-Deprecation-Date'
        API-End-of-Life-Date:
          $ref: '#/components/headers/API-End-of-Life-Date'
        API-Next-Release:
          $ref: '#/components/headers/API-Next-Release'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DigitaleDelta.ParameterCollectionResponse'

    DigitaleDelta.FoiCollectionResponse:
      description: Retrieved Feature of Interest collection
      headers:
        Content-Crs:
          $ref: '#/components/headers/Content-Crs'
        API-Version:
          $ref: '#/components/headers/API-Version'
        API-Deprecation-Date:
          $ref: '#/components/headers/API-Deprecation-Date'
        API-End-of-Life-Date:
          $ref: '#/components/headers/API-End-of-Life-Date'
        API-Next-Release:
          $ref: '#/components/headers/API-Next-Release'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DigitaleDelta.FoiCollectionResponse'

  parameters:
    top:
      name: $top
      in: query
      description: Show only the first n items
      style: form
      explode: false
      schema:
        minimum: 0
        type: integer
      examples:
        simple:
          value: 1

    skiptoken:
      name: $skiptoken
      in: query
      description: The skip token, used to retrieve the next page of data. Generated by the service.
      schema:
        type: string

    select:
      name: $select
      in: query
      description: Select the properties to return.
      schema:
        type: string

    count:
      name: $count
      in: query
      description: Include count of items
