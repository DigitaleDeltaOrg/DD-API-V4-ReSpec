    top:
      name: $top
      in: query
      description: Show only the first n items
      style: form
      explode: false
      schema:
        minimum: 0
        type: integer
      examples:
        simple:
          value: 1

    skiptoken:
      name: $skiptoken
      in: query
      description: The skip token, used to retrieve the next page of data. Generated by the service.
      schema:
        type: string

    select:
      name: $select
      in: query
      description: Select the properties to return.
      schema:
        type: string

    count:
      name: $count
      in: query
      description: Include count of items
      style: form
      explode: false
      schema:
        type: boolean

    filter:
      name: $filter
      in: query
      description: Filter items by property values
      style: form
      explode: false
      schema:
        type: string

    bbox:
      name: bbox
      in: query
      description: Select the bounding box to return.
      schema:
        type: string
    
    accept-crs-header:
      name: Accept-Crs
      in: header
      description: CRS (EPSG:...) in which coordinates need to be expressed .
      schema:
        type: string
    
    prefer-header:
      name: prefer
      in: header
      description: Prefer header (i.e. null-suppression)
      schema:
        type: string
    
  headers:
    API-Version:
      description: The version of the API.
      required: true
      schema:
        type: string
      examples:
        simple:
          value: 3.0.0

    API-Deprecation-Date:
      description: The date that the API will be deprecated.
      required: true
      schema:
        type: string
        format: date

    API-End-of-Life-Date:
      description: The date that the API will be end-of-life.
      required: true
      schema:
        type: string
        format: date

    API-Next-Release:
      description: Next release version of the API.
      required: true
      schema:
        type: string

    Content-Crs:
      description: The Coordinate Reference System (CRS) response conforms to. 4258 is the default.
      required: false
      schema:
        type: string

    DD-V4-Semantics:
      description: Semantics header, i.e. for null-suppression
      required: true
      schema:
        type: string

    DD-V4-ResultTypes:
