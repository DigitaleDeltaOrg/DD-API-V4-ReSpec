openapi: 3.1.0
info:
  title: DD-API-V4 - Base schema
  # Aanpassen
  description: Digitale Delta API V4
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  version: 4.0.1
  x-logo:
    # Eventueel uitbreiden met eigen tekst
    url: /v4/DigitaleDelta.svg
externalDocs:
  description: Official documentation
  url: https://digitaledeltaorg.github.io/DD-API-V4-ReSpec/

servers:
  # {servers}
  - url: https://api.digitaledelta.nl/v4/odata

paths:
  /v4/odata/observations:
    description: Provides access to observations.
    get:
      tags:
        - Observation
        - FoI
        - FeatureOfInterest
        - Parameter
      summary: Get entities from observations
      description: Get the observation data of the Digitale Delta API.
      operationId: observations.Observation.ListObservation
      # {security./v4/odata/observation}
      parameters:
        - $ref: '#/components/parameters/top'
        - $ref: '#/components/parameters/skiptoken'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/prefer-header'
        - $ref: '#/components/parameters/accept-crs-header'
      responses:
        '200':
          $ref: '#/components/responses/DigitaleDelta.ObservationCollectionResponse'
        default:
          $ref: '#/components/responses/error'

  /v4/odata/parameters:
    description: Provides access to domain tables/enties for possible items in parameters.
    get:
      tags:
        - Parameter
      summary: Get entities from references
      description: Get the reference data of the Digitale Delta API.
      operationId: parameters.ListParameters
      # {security./v4/odata/parameter}
      parameters:
        - $ref: '#/components/parameters/top'
        - $ref: '#/components/parameters/skiptoken'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/prefer-header'
        - $ref: '#/components/parameters/accept-crs-header'
      responses:
        '200':
          $ref: '#/components/responses/DigitaleDelta.ParameterCollectionResponse'
        default:
          $ref: '#/components/responses/error'

  /v4/odata/foi:
    description: Provides access to information for features of interest. This includes measurement objects and monitoring networks.
    get:
      tags:
        - FoI
        - FeatureOfInterest
      summary: Get entities from Features of Interest
      description: Get the Feature of Interest data of the Digitale Delta API.
      operationId: foi.ListFoi
      # {security./v4/odata/foi}
      parameters:
        - $ref: '#/components/parameters/top'
        - $ref: '#/components/parameters/skiptoken'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/prefer-header'
        - $ref: '#/components/parameters/accept-crs-header'
      responses:
        '200':
          $ref: '#/components/responses/DigitaleDelta.FoiCollectionResponse'
        default:
          $ref: '#/components/responses/error'

  /v4/geo/measurementobject:
    get:
      tags:
        - FeatureOfInterest
        - FoI
        - JSON-FG collection
      summary: Get list of measurement objects.
      description: Get a list of measurement objects.
      operationId: geo.MeasurementObject.GetList
      # {security./v4/geo/measurementobject}
      parameters:
        - $ref: '#/components/parameters/bbox'
        - $ref: '#/components/parameters/prefer-header'
        - $ref: '#/components/parameters/accept-crs-header'
      responses:
        '200':
          description: Retrieved measurement objects
          content:
            application/json:
              schema:
                #$ref: 'https://schemas.opengis.net/json-fg/featurecollection.json'
                type: object
        '404':
          $ref: '#/components/responses/error'
        default:
          $ref: '#/components/responses/error'
  
  /v4/geo/measurementobject/{id}:
    get:
      tags:
        - FeatureOfInterest
        - FoI
        - JSON-FG
      summary: Get measurement object by id
      description: Get a single measurement object by its identifier.
      operationId: geo.MeasurementObject.GetMeasurementObjectById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the measurement object.
          schema:
            type: string
      responses:
        '200':
          description: Retrieved measurement object
          content:
            application/json:
              schema:
                #$ref: 'https://schemas.opengis.net/json-fg/feature.json'
                type: object
        '404':
          $ref: '#/components/responses/error'
        default:
          $ref: '#/components/responses/error'
    
components:
  # {securitySchemas}
  schemas:
    DigitaleDelta.Parameter:
      title: Parameter
      type: object
      description: A parameter defines standardised properties of an observation's parameter container. 
      properties:
        id:
          type: string
          description: Unique ID of the reference.
        type:
          type: string
          description: Type of the reference
        organisation:
          type: string
          description: Organisation responsible for the reference
        code:
          type: string
          description: Code of the reference
        description:
          type: string
          description: Short description of the reference
        details:
          $ref: "#/components/schemas/DigitaleDelta.ParameterDetailsContainer"
    
    DigitaleDelta.Foi:
      title: Feature of Interest
      description: Feature of Interest as defined in the DD API V4 CSDL.
      type: object
      required:
        - id
        - code
        - description
        - geometry
        - organisation
      properties:
        id:
          type: string
          description: Id of the Feature of Interest.
        type:
          type: string
          description: Type of the Feature of Interest.
        organisation:
          type: string
          description: Organisation responsible for the Feature of Interest.
        code:
          type: string
          description: Code of the Feature of Interest.
        geometry:
          $ref: '#/components/schemas/Edm.Geometry'
        description:
          type: string
          description: Description of the Feature of Interest.
        identities:
          $ref: '#/components/schemas/DigitaleDelta.FoiIdentityContainer'
        classifications:
          $ref: '#/components/schemas/DigitaleDelta.FoiClassificationContainer'
    
    DigitaleDelta.FoiDetails:
      title: Feature of Interest Details (as entity)
      description: Feature of Interest Details as defined in the DD API V4 CSDL.
      type: object
      required:
        - id
        - code
        - description
        - geometry
        - organisation
      properties:
        id:
          type: string
          description: Id of the Feature of Interest (details).
        type:
          type: string
          description: Type of the Feature of Interest (details).
        organisation:
          type: string
          description: Organisation responsible for the Feature of Interest (details).
        code:
          type: string
          description: Code of the Feature of Interest (details).
        geometry:
          $ref: '#/components/schemas/Edm.Geometry'
        description:
          type: string
          description: Description of the Feature of Interest (details).
        identities:
          $ref: '#/components/schemas/DigitaleDelta.FoiIdentityDetailsContainer'
        classifications:
          $ref: '#/components/schemas/DigitaleDelta.FoiClassificationDetailsContainer'   
    
    DigitaleDelta.Observation:
      title: Observation
      type: object
      description: Defines an observation. The type-property of the observation defines how the results are expressed.
      required:
        - id
        - type
        - resultTime
        - phenomenonTime
        - parameter
        - modifiedOn
      properties:
        id:
          type: string
          description: Unique ID of the observation.
        type:
          type: string
          description: Type of the observation.
        resultTime:
          type: string
          format: date-time
        phenomenonTime:
          $ref: '#/components/schemas/DigitaleDelta.TmPeriod_Closed'
        validTime:
          $ref: '#/components/schemas/DigitaleDelta.TmPeriod_OpenEnd'
        parameter:
          $ref: '#/components/schemas/DigitaleDelta.ParameterContainer'
        metadata:components:
          $ref: '#/components/schemas/DigitaleDelta.MetadataContainer'
        foi:
          $ref: '#/components/schemas/DigitaleDelta.Foi'
          description: Feature of Interest.
        result:
          $ref: '#/components/schemas/DigitaleDelta.Result'
        modifiedOn:
          type: string
          format: date-time
  
    DigitaleDelta.TmPeriod_OpenEnd:
      title: TmPeriod_OpenEnd
      description: A time period with an open end.
      type: object
      required:
        - begin
      properties:
        begin:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    
    DigitaleDelta.TmPeriod_Closed:
      title: TmPeriod_Closed
      description: A time period with a closed end.
      type: object
      required:
        - begin
        - end
      properties:
        begin:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
     
    DigitaleDelta.ParameterContainer:
      title: ParameterContainer
      type: object
      description: Defines the quantifiable references related to the observation. Can be expanded with V4 SemanticPropertyBag from group 'parameter' for required domain/version.
      additionalProperties: true
      # {SemanticPropertyBag("parameter")}
      
    DigitaleDelta.ParameterDetailsContainer:
      title: ParameterDetailsContainer
      type: object
      description: Defines the quantifiable references known to the system. Can be expanded with V4 SemanticPropertyBag from group 'parameterDetails' for required domain/version.
      additionalProperties: true
      # {SemanticPropertyBag("parameterDetails")}
    
    DigitaleDelta.FoiIdentityContainer:
      title: FoiIdentityContainer
      type: object
      description: Defines alternate identities for FoI Can be expanded with V4 SemanticPropertyBag from group 'foiIdentitiesForObservation' for required domain/version.
      additionalProperties: true
      # {SemanticPropertyBag("foiIdentitiesForObservation")}
      
    DigitaleDelta.FoiClassificationContainer:
      title: FoiClassificationContainer
      type: object
      description: Defines classifications for FoI. Can be expanded with V4 SemanticPropertyBag from group 'foiClassificationsForObservation' for required domain/version.
      additionalProperties: true
      # {SemanticPropertyBag("foiClassificationsForObservation")}

    DigitaleDelta.FoiIdentityDetailsContainer:
      title: FoiIdentityDetailsContainer
      type: object
      description: Defines alternate identities for FoI. Can be expanded with V4 SemanticPropertyBag from group 'foiIdentitiesForFoi' for required domain/version.
      additionalProperties: true
      # {SemanticPropertyBag("foiIdentitiesForFoi")}
    
    DigitaleDelta.FoiClassificationDetailsContainer:
      title: FoiClassificationDetailsContainer
      type: object
      description: Defines classifications for FoI.  Can be expanded with V4 SemanticPropertyBag from group 'foiClassificationsForFoi' for required domain/version.
      additionalProperties: true
      # {SemanticPropertyBag("foiClassificationsForFoi")}

    DigitaleDelta.MetadataContainer:
      title: MetadataContainer
      type: object
      description: Non-quantifiable data. Can be expanded with V4 SemanticPropertyBag from group 'metadata' for required domain/version.
      additionalProperties: true
      # {SemanticPropertyBag("metadata")}
      
    DigitaleDelta.Result:
      title: Result
      type: object
      description: Result of an observation. Result is polymorphic.
      required:
        - id
      properties:
        id:
          type: string
          description: Unique ID of the result.
      oneOf:
        - required: [ truth ]
          properties:
            truth:
              type: boolean
              description: Truth observation. Can only result in true or false.
        - required: [ count ]
          properties:
            count:
              type: integer
              format: int64
              description: Count observation. No unit specified and the value can only be an integer value.
        - required: [measure]
          properties:
            measure:
              $ref: '#/components/schemas/DigitaleDelta.Measure'
              description: Result is expressed in a unit and a value.
        - required: [category]
          properties:
            category:
              $ref: '#/components/schemas/DigitaleDelta.Category'
              description: Result is expressed as a category.
        - required: [coverageJSON]
          properties:
            coverageJSON:
              $ref: '#/components/schemas/DigitaleDelta.CoverageJSON'
              description: Result is expressed as CoverageJSON.
        - required: [retracted]
          properties:
            retracted:
              $ref: '#/components/schemas/DigitaleDelta.Retracted'
    
    DigitaleDelta.Measure:
      title: Measure
      type: object
      description: Result is expressed in a unit and a value with optional namespace and limit symbol.
      required:
        - uom
        - value
      properties:
        uom:
          type: string
          description: Unit of measurement.
        value:
          oneOf:
            - type: number
              format: double
            - type: string
          description: Measured value.
        namespace:
          type: string
          description: Namespace of the unit of the measured value.
        limitSymbol:
          type: string
          description: Limit symbol of the measured value.
    
    DigitaleDelta.Category:
      title: Category
      type: object
      description: Category of the result expressed in dictionary/term.
      required:
        - nameSpace
        - code
      properties:
        nameSpace:
          type: string
          description: Vocabulary namespace.
        code:
          type: string
          description: Term within the vocabulary.
    
    DigitaleDelta.Retracted:
      title: Retracted
      type: object
      description: Retracted indicates that the observation has been retracted.
      required:
        - reason
      properties:
        reason:
          type: string
      
    Edm.Geometry:
      description: Geometry object used for time series, ensembles, coverages and other data.
      oneOf:
        - $ref: '#/components/schemas/Edm.GeometryPoint'
        - $ref: '#/components/schemas/Edm.GeometryLineString'
        - $ref: '#/components/schemas/Edm.GeometryPolygon'
        - $ref: '#/components/schemas/Edm.GeometryMultiPoint'
        - $ref: '#/components/schemas/Edm.GeometryMultiLineString'
        - $ref: '#/components/schemas/Edm.GeometryMultiPolygon'
        - $ref: '#/components/schemas/Edm.GeometryCollection'
      discriminator:
        propertyName: type

    Edm.GeometryPoint:
      type: object
      description: Geometry point.
      properties:
        type:
          type: string
          enum:
            - Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2

    Edm.GeometryLineString:
      type: object
      description: Geometry line string.
      properties:
        type:
          type: string
          enum:
            - LineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
          minItems: 2

    Edm.GeometryPolygon:
      type: object
      description: Geometry polygon.
      properties:
        type:
          type: string
          enum:
            - Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
            minItems: 4

    Edm.GeometryMultiPoint:
      type: object
      description: Geometry multi point.
      properties:
        type:
          type: string
          enum:
            - MultiPoint
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2

    Edm.GeometryMultiLineString:
      type: object
      description: Geometry multi line string.
      properties:
        type:
          type: string
          enum:
            - MultiLineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
            minItems: 2

    Edm.GeometryMultiPolygon:
      type: object
      description: Geometry multi polygon.
      properties:
        type:
          type: string
          enum:
            - MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: number
                minItems: 2
              minItems: 4

    Edm.GeometryCollection:
      type: object
      description: Geometry collection.
      required:
        - type
        - geometries
      properties:
        type:
          type: string
          enum: [GeometryCollection]
        geometries:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Edm.GeometryPoint'
              - $ref: '#/components/schemas/Edm.GeometryLineString'
              - $ref: '#/components/schemas/Edm.GeometryPolygon'
              - $ref: '#/components/schemas/Edm.GeometryMultiPoint'
              - $ref: '#/components/schemas/Edm.GeometryMultiLineString'
              - $ref: '#/components/schemas/Edm.GeometryMultiPolygon'

    DigitaleDelta.ODataErrors.ODataError:
      required:
        - error
      type: object
      description: Describes OData errors
      properties:
        error:
          $ref: '#/components/schemas/DigitaleDelta.ODataErrors.MainError'

    DigitaleDelta.ODataErrors.MainError:
      required:
        - code
        - message
      type: object
      description: Main error object.
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/DigitaleDelta.ODataErrors.ErrorDetails'
        innererror:
          $ref: '#/components/schemas/DigitaleDelta.ODataErrors.InnerError'

    DigitaleDelta.ODataErrors.ErrorDetails:
      required:
        - code
        - message
      type: object
      description: Error details object.
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string

    DigitaleDelta.ODataErrors.InnerError:
      type: object
      description: The structure of this object is service-specific

    DigitaleDelta.ParameterCollectionResponse:
      title: Collection of References
      description: Collection of references.
      type: object
      headers:
        Content-Crs:
          $ref: '#/components/headers/Content-Crs'
        API-Version:
          $ref: '#/components/headers/API-Version'
        API-Deprecation-Date:
          $ref: '#/components/headers/API-Deprecation-Date'
        API-End-of-Life-Date:
          $ref: '#/components/headers/API-End-of-Life-Date'
        API-Next-Release:
          $ref: '#/components/headers/API-Next-Release'
        prefer:
          $ref: '#/components/parameters/prefer-header'
        DD-API-V4-Semantics:
          $ref: '#/components/headers/DD-V4-Semantics'
        accept-crs:
          $ref: '#/components/parameters/accept-crs-header'
      allOf:
        - $ref: '#/components/schemas/BaseCollectionPaginationCountResponse'
        - type: object
          headers:
            prefer:
              $ref: '#/components/parameters/prefer-header'
            accept-crs:
              $ref: '#/components/parameters/accept-crs-header'
            DD-API-V4-Semantics:
              $ref: '#/components/headers/DD-V4-Semantics'
          properties:
            value:
              type: array
              items:
                $ref: '#/components/schemas/DigitaleDelta.Parameter'
    
    DigitaleDelta.FoiCollectionResponse:
      title: Collection of Foi references.
      description: Collection of FOI references.
      type: object
      headers:
        Content-Crs:
          $ref: '#/components/headers/Content-Crs'
        API-Version:
          $ref: '#/components/headers/API-Version'
        API-Deprecation-Date:
          $ref: '#/components/headers/API-Deprecation-Date'
        API-End-of-Life-Date:
          $ref: '#/components/headers/API-End-of-Life-Date'
        API-Next-Release:
          $ref: '#/components/headers/API-Next-Release'
        prefer:
          $ref: '#/components/parameters/prefer-header'
        DD-API-V4-Semantics:
          $ref: '#/components/headers/DD-V4-Semantics'
        accept-crs:
          $ref: '#/components/parameters/accept-crs-header'
      allOf:
        - $ref: '#/components/schemas/BaseCollectionPaginationCountResponse'
        - type: object
          properties:
            value:
              type: array
              items:
                $ref: '#/components/schemas/DigitaleDelta.FoiDetails'

    DigitaleDelta.ObservationCollectionResponse:
      title: Collection of Observation references.
      description: Collection of Observation references.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseCollectionPaginationCountResponse'
        - type: object
          headers:
            Content-Crs:
              $ref: '#/components/headers/Content-Crs'
            API-Version:
              $ref: '#/components/headers/API-Version'
            API-Deprecation-Date:
              $ref: '#/components/headers/API-Deprecation-Date'
            API-End-of-Life-Date:
              $ref: '#/components/headers/API-End-of-Life-Date'
            API-Next-Release:
              $ref: '#/components/headers/API-Next-Release'
            prefer:
              $ref: '#/components/parameters/prefer-header'
            DD-API-V4-Semantics:
              $ref: '#/components/headers/DD-V4-Semantics'
            accept-crs:
              $ref: '#/components/parameters/accept-crs-header'
          properties:
            value:
              type: array
              items:
                $ref: '#/components/schemas/DigitaleDelta.Observation'

    BaseCollectionPaginationCountResponse:
      title: Base collection pagination and count responses
      description: Base collection pagination and count responses.
      type: object
      headers:
        Content-Crs:
          $ref: '#/components/headers/Content-Crs'
        API-Version:
          $ref: '#/components/headers/API-Version'
        API-Deprecation-Date:
          $ref: '#/components/headers/API-Deprecation-Date'
        API-End-of-Life-Date:
          $ref: '#/components/headers/API-End-of-Life-Date'
        API-Next-Release:
          $ref: '#/components/headers/API-Next-Release'
        prefer:
          $ref: '#/components/parameters/prefer-header'
        DD-API-V4-Semantics:
          $ref: '#/components/headers/DD-V4-Semantics'
        accept-crs:
          $ref: '#/components/parameters/accept-crs-header'
      properties:
        '@odata.count':
          type: integer
          format: int64
        '@odata.nextLink':
          type: string
          description: URL to retrieve the next page of results

    DigitaleDelta.CoverageJSON:
      title: CoverageJSON
      description: CoverageJSON format object used for time series, ensembles, coverages and other data.
      type: object
      properties:
        type:
          type: string
        domain:
          $ref: '#/components/schemas/DigitaleDelta.CoverageDomain'
        parameters:
          $ref: '#/components/schemas/DigitaleDelta.CoverageParameterContainer'
        ranges:
          $ref: '#/components/schemas/DigitaleDelta.CoverageRangeContainer'
        nodata:
          type: string
        profile:
          type: string

    DigitaleDelta.CoverageDomain:
      title: CoverageDomain
      description: CoverageDomain object used for time series, ensembles, coverages and other data.
      type: object
      properties:
        type:
          type: string
        axes:
          $ref: '#/components/schemas/DigitaleDelta.CoverageAxes'
        referencing:
          type: array
          items:
            $ref: '#/components/schemas/DigitaleDelta.CoverageReferencing'
        CRS:
          type: string

    DigitaleDelta.CoverageAxes:
      title: CoverageAxes
      type: object
      description: CoverageAxes object used for time series, ensembles, coverages and other data.
      additionalProperties:
        $ref: '#/components/schemas/DigitaleDelta.CoverageAxis'
      properties:
        x:
          $ref: '#/components/schemas/DigitaleDelta.CoverageAxis'

    DigitaleDelta.CoverageAxis:
      title: CoverageAxis
      type: object
      description: CoverageAxis object used for time series, ensembles, coverages and other data.
      properties:
        type:
          type: string
        values:
          type: array
          items:
            type: number
            format: double
        start:
          type: number
          format: double
        size:
          type: integer
          format: int64
        offset:
          type: number
          format: double
        spacing:
          type: number
          format: double
        keys:
          type: array
          items:
            type: string

    DigitaleDelta.CoverageReferencing:
      title: CoverageReferencing
      type: object
      description: CoverageReferencing object used for time series, ensembles, coverages and other data.
      properties:
        coordinates:
          type: string
        system:
          type: string
        datum:
          type: string

    DigitaleDelta.CoverageParameterContainer:
      title: CoverageParameterContainer
      type: object
      description: CoverageParameterContainer object used for time series, ensembles, coverages and other data.
      additionalProperties:
        $ref: '#/components/schemas/DigitaleDelta.CoverageParameterDefinition'

    DigitaleDelta.CoverageParameterDefinition:
      title: CoverageParameterDefinition
      type: object
      description: CoverageParameterDefinition object used for time series, ensembles, coverages and other data.
      properties:
        type:
          type: string
        units:
          type: string
        observedProperty:
          type: string
        description:
          type: string
        flags:
          type: string

    DigitaleDelta.CoverageRangeContainer:
      title: CoverageRangeContainer
      description: CoverageRangeContainer object used for time series, ensembles, coverages and other data.
      type: object
      additionalProperties:
        $ref: '#/components/schemas/DigitaleDelta.CoverageRangeDefinition'

    DigitaleDelta.CoverageRangeDefinition:
      title: CoverageRangeDefinition
      description: CoverageRangeDefinition object used for time series, ensembles, coverages and other data.
      type: object
      properties:
        type:
          type: string
        dataType:
          type: string
        axisNames:
          type: array
          items:
            type: string
        shape:
          type: array
          items:
            type: integer
            format: int64
        values:
          type: array
          items:
